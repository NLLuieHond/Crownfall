name: Bouw Crownfall voor 3DS
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Herstel bestanden voor de 3DS
        run: |
          python3 - <<'PY'
          p='source/main.c'; s=open(p).read()
          s=s.replace("int len = 0; JS_ToInt32(ctx, &len, lv);","int32_t len = 0; JS_ToInt32(ctx, &len, lv);")
          open(p,'w').write(s)
          p='quickjs/quickjs.c'; s=open(p).read()
          if '#ifndef PRId64' not in s:
              s=s.replace("#include <inttypes.h>\n","#include <inttypes.h>\n#ifndef PRId64\n#define PRId64 \"lld\"\n#endif\n#ifndef PRIu64\n#define PRIu64 \"llu\"\n#endif\n#ifndef PRIx64\n#define PRIx64 \"llx\"\n#endif\n",1)
          s=s.replace("#if !defined(EMSCRIPTEN)\n#define CONFIG_ATOMICS","#if 0\n#define CONFIG_ATOMICS",1)
          s=s.replace("    ti = time;\n    localtime_r(&ti, &tm);\n    return -tm.tm_gmtoff / 60;","    return 0;",1)
          s=s.replace("    /* change this to `return 0;` if compilation fails */\n    return malloc_usable_size(ptr);","    return 0;")
          s=s.replace("    /* change this to `NULL,` if compilation fails */\n    malloc_usable_size,","    NULL,")
          open(p,'w').write(s)
          p='Makefile'; s=open(p).read()
          if 'Wno-incompatible-pointer-types' not in s:
              s=s.replace("-funsigned-char -w ","-funsigned-char -w -Wno-incompatible-pointer-types ")
          open(p,'w').write(s)
          PY
      - name: Bouw .3dsx
        run: make
      - name: Bouw .cia
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
          set -x
          apt-get update && apt-get install -y curl unzip jq
          rel() { curl -fsSL "https://api.github.com/repos/$1/releases/latest"; }
          MR=$(rel 3DSGuy/Project_CTR | jq -r '.assets[].browser_download_url' | grep -i ubuntu | grep -i x86_64 | head -1)
          curl -fsSL "$MR" -o makerom.zip && unzip -o makerom.zip && chmod +x makerom
          apt-get install -y git g++
          git clone --depth 1 https://github.com/carstene1ns/3ds-bannertool bt-src
          g++ -std=c++17 -O2 -w -Ibt-src/source -Ibt-src/source/pc -DSTBI_ONLY_PNG -DSTBI_NO_LINEAR -DSTBI_NO_STDIO -DSTB_VORBIS_NO_PUSHDATA_API -DSTB_VORBIS_NO_STDIO -DDR_WAV_NO_STDIO -DVERSION='"1.2.3"' $(find bt-src/source -name '*.cpp') -o bannertool
          BT=./bannertool
          "$BT" makebanner -i banner.png -a silence.wav -o banner.bnr
          "$BT" makesmdh -s "Crownfall" -l "Strategiespel" -p "Crownfall" -i icon.png -o icon.icn
          ./makerom -f cia -o crownfall.cia -elf crownfall.elf -rsf crownfall.rsf -icon icon.icn -banner banner.bnr -exefslogo -target t -DAPP_ROMFS=romfs
          ls -la crownfall.cia
          } 2>&1 | tee cia.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Crownfall-3DS
          path: |
            crownfall.3dsx
            crownfall.cia
            cia.log
          if-no-files-found: warn
