name: Bouw Crownfall voor 3DS
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Herstel bestanden voor de 3DS
        run: |
          python3 - <<'PY'
          p='source/main.c'; s=open(p).read()
          s=s.replace("int len = 0; JS_ToInt32(ctx, &len, lv);","int32_t len = 0; JS_ToInt32(ctx, &len, lv);")
          open(p,'w').write(s)
          p='quickjs/quickjs.c'; s=open(p).read()
          if '#ifndef PRId64' not in s:
              s=s.replace("#include <inttypes.h>\n","#include <inttypes.h>\n#ifndef PRId64\n#define PRId64 \"lld\"\n#endif\n#ifndef PRIu64\n#define PRIu64 \"llu\"\n#endif\n#ifndef PRIx64\n#define PRIx64 \"llx\"\n#endif\n",1)
          s=s.replace("#if !defined(EMSCRIPTEN)\n#define CONFIG_ATOMICS","#if 0\n#define CONFIG_ATOMICS",1)
          s=s.replace("    ti = time;\n    localtime_r(&ti, &tm);\n    return -tm.tm_gmtoff / 60;","    return 0;",1)
          s=s.replace("    /* change this to `return 0;` if compilation fails */\n    return malloc_usable_size(ptr);","    return 0;")
          s=s.replace("    /* change this to `NULL,` if compilation fails */\n    malloc_usable_size,","    NULL,")
          open(p,'w').write(s)
          p='Makefile'; s=open(p).read()
          if 'Wno-incompatible-pointer-types' not in s:
              s=s.replace("-funsigned-char -w ","-funsigned-char -w -Wno-incompatible-pointer-types ")
          open(p,'w').write(s)
          PY
      - name: Bouw .3dsx
        run: make
      - name: Bouw .cia
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
          set -x
          apt-get update && apt-get install -y git g++ make
          # bannertool en makerom worden hier zelf gebouwd (de kant-en-klare versies draaien niet op deze computer)
          git clone --depth 1 https://github.com/carstene1ns/3ds-bannertool bt-src
          g++ -std=c++17 -O2 -w -Ibt-src/source -Ibt-src/source/pc -DSTBI_ONLY_PNG -DSTBI_NO_LINEAR -DSTBI_NO_STDIO -DSTB_VORBIS_NO_PUSHDATA_API -DSTB_VORBIS_NO_STDIO -DDR_WAV_NO_STDIO -DVERSION='"1.2.3"' $(find bt-src/source -name '*.cpp') -o bannertool
          git clone https://github.com/3DSGuy/Project_CTR ctr-src
          git -C ctr-src checkout d52c2b0e788c2d085763d7c5dcc4b2edd9ffb7d8 || true
          make -C ctr-src/makerom -j4
          cp ctr-src/makerom/bin/makerom ./makerom
          # het rsf-bestand aanpassen voor de nieuwe makerom
          python3 - <<'PY'
          s = open('crownfall.rsf').read()
          s = '\n'.join(l for l in s.split('\n') if 'MediaFootPrint' not in l)
          if 'SystemCallAccess' not in s:
              sc = "  SystemCallAccess:\n" + "".join("    %s: %s\n" % tuple(x.split(':')) for x in "ArbitrateAddress:34 Break:60 CancelTimer:28 ClearEvent:25 ClearTimer:29 CloseHandle:35 ConnectToPort:45 ControlMemory:1 CreateAddressArbiter:33 CreateEvent:23 CreateMemoryBlock:30 CreateMutex:19 CreateSemaphore:21 CreateThread:8 CreateTimer:26 DuplicateHandle:39 ExitProcess:3 ExitThread:9 GetCurrentProcessorNumber:17 GetHandleInfo:41 GetProcessId:53 GetProcessIdOfThread:54 GetResourceLimit:56 GetResourceLimitCurrentValues:58 GetResourceLimitLimitValues:57 GetSystemInfo:42 GetSystemTick:40 GetThreadContext:59 GetThreadId:55 GetThreadIdealProcessor:15 GetThreadPriority:11 MapMemoryBlock:31 OutputDebugString:61 QueryMemory:2 ReleaseMutex:20 ReleaseSemaphore:22 SendSyncRequest1:46 SendSyncRequest2:47 SendSyncRequest3:48 SendSyncRequest4:49 SendSyncRequest:50 SetThreadPriority:12 SetTimer:27 SignalEvent:24 SleepThread:10 UnmapMemoryBlock:32 WaitSynchronization1:36 WaitSynchronizationN:37".split())
              s = s.replace("  IdealProcessor", sc + "  IdealProcessor", 1)
          open('crownfall.rsf', 'w').write(s)
          PY
          ./bannertool makebanner -i banner.png -a silence.wav -o banner.bnr
          ./bannertool makesmdh -s "Crownfall" -l "Strategiespel" -p "Crownfall" -i icon.png -o icon.icn
          ./makerom -f cia -o crownfall.cia -elf crownfall.elf -rsf crownfall.rsf -icon icon.icn -banner banner.bnr -exefslogo -target t -DAPP_ROMFS=romfs
          ls -la crownfall.cia
          } 2>&1 | tee cia.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Crownfall-3DS
          path: |
            crownfall.3dsx
            crownfall.cia
            cia.log
          if-no-files-found: warn
